  src: "§8.2"
  ms: 6
  tier: L1
  text: "Add returns 201, 400 invalid_torrent / invalid_magnet / invalid_download_dir, or 409 already_exists with the id and the new trackers merged in."
  check: {go: ./internal/api, run: TestAddTorrent}

- id: API-03
  src: "G14"
  ms: 6
  tier: L3
  text: "Adding a .torrent for a magnet still in metadata supplies the metadata and returns 409 with the id."
