- id: API-11
  src: "§7.2, G2, G3"
  ms: 6
  tier: L1
  text: "Default settings match §7.2 plus max_half_open=20; internal keys are never returned or accepted."
  check: {go: ./internal/api, run: TestSettingsDefaults}

- id: API-12
  src: "G18"
  ms: 6
  tier: L1
  text: "The action-validity matrix (§16.4) returns the specified 204/409 for every state × action pair."
  check: {go: ./internal/api, run: TestActionValidity}

- id: API-13
  src: "G20"
  ms: 6
  tier: L1
  text: "Every response in the API test suite validates against spec/openapi.yaml."
