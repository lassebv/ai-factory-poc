# ───────────────────────── M3 Single-peer download ─────────────────────────

- id: ADD-01
  src: "§8.1, §8.2, ADR-0011"
  ms: 3
  tier: L3
  text: "POST /api/v1/torrents (multipart file + downloadDir) returns 201 with a Torrent; GET /api/v1/torrents/{id} and GET /api/v1/torrents return it; a duplicate returns 409 already_exists with the id; a relative downloadDir returns 400 invalid_download_dir; the download dir is created if missing."
  check: {go: ./acceptance/download, module: harness, run: TestAddTorrent}

- id: TRK-01
  src: "§4.1 HTTP trackers, §6.2"
  ms: 3
  tier: L3
  text: "torrentd announces event=started on add, event=completed (left=0) when the download finishes, and event=stopped on SIGTERM within the 3 s shutdown budget."
  check: {go: ./acceptance/download, module: harness, run: TestAnnounceLifecycle}

- id: TRK-02
  src: "§4.1, D7, D13"
  ms: 3
  tier: L3
  text: "Announces carry the info_hash, a 20-byte peer_id starting with -TD0100-, the listen port, uploaded/downloaded/left, compact=1, numwant=50 and a key that stays the same for the session."
  check: {go: ./acceptance/download, module: harness, run: TestAnnounceParams}

- id: TRK-03
  src: "§4.1 HTTP trackers"
  ms: 3
  tier: L3
  text: "A tracker that returns a non-compact (dict) peer list works as well as a compact one: the download completes."
  check: {go: ./acceptance/download, module: harness, run: TestNonCompactPeers}

- id: WIRE-01
  src: "§4.1 Peer wire, D13"
  ms: 3
  tier: L3
  text: "torrentd sends a correct BitTorrent handshake (pstr, 8 reserved bytes, info_hash, peer_id) and completes a download from a scriptable peer."
  check: {go: ./acceptance/download, module: harness, run: TestHandshake}

- id: WIRE-02
  src: "§11 robustness"
  ms: 3
  tier: L3
  text: "A peer that sends a message longer than 16 KiB + 13 bytes (other than bitfield) is disconnected, and torrentd keeps running."
  check: {go: ./acceptance/download, module: harness, run: TestOversizeMessageDisconnects}

- id: WIRE-04
  src: "§11 robustness"
  ms: 3
  tier: L3
  text: "40 peers that send random garbage after the handshake (at least 20 of them connected to) do not crash torrentd: it stays healthy and still completes the download from a good peer."
  check: {go: ./acceptance/download, module: harness, run: TestGarbageDoesNotCrash}

- id: WIRE-05
  src: "§4.1 Peer wire"
  ms: 3
  tier: L3
  text: "Blocks are requested in 16 KiB units (only the last block of the last piece may be shorter), never past a piece end, and requests are pipelined (at least 5 outstanding at some point, never more than 250)."
  check: {go: ./acceptance/download, module: harness, run: TestBlockRequests}

- id: STOR-01
  src: "§4.1 Storage, §13"
  ms: 3
  tier: L3
  text: "A multi-file torrent whose pieces span file boundaries (including a zero-length file and a file smaller than a piece) downloads byte-for-byte correctly."
  check: {go: ./acceptance/download, module: harness, run: TestSpanningPieces}

- id: STOR-02
  src: "§4.1, G21"
  ms: 3
  tier: L3
  text: "Files are preallocated (sparsely) as <file>.part when the download starts (§4.1 Storage). Each file is renamed to its final name as soon as all its pieces verify, so during a download finished files have final names and unfinished ones are still .part; after completion, no .part files remain."
  check: {go: ./acceptance/download, module: harness, run: TestPartFiles}

- id: STOR-04
  src: "C2, ADR-0001"
  ms: 3
  tier: L3
  text: "Downloading a hybrid torrent with BEP 47 pad files writes the real files byte-for-byte and never creates pad files on disk."
  check: {go: ./acceptance/download, module: harness, run: TestPadFilesNotCreated}

- id: STOR-05
  src: "§4.1 Hash verification"
  ms: 3
  tier: L3
  text: "A piece that arrives corrupted is discarded and downloaded again; the final data is correct and wastedTotal includes at least that piece."
  check: {go: ./acceptance/download, module: harness, run: TestHashFailureRecovers}

- id: STOR-06
  src: "§4.1 Storage, D9"
  ms: 3
  tier: L3
  text: "Downloading a torrent with 300 files never holds more than 128 open file handles under the download dir."
  check: {go: ./acceptance/download, module: harness, run: TestOpenFileLimit}

- id: STOR-07
  src: "§11 security"
  ms: 3
  tier: L3
  text: "After a download, torrentd has created no files outside the download dir and its data dir."
  check: {go: ./acceptance/download, module: harness, run: TestWritesStayInDownloadDir}

- id: SP-01
  src: "§15.3, §11 interop"
  ms: 3
  tier: L4
  text: "torrentd downloads a multi-file torrent from a real libtorrent seeder (Docker) through an HTTP tracker; the data is byte-identical, and the torrent ends in state seeding with progress 1."
  timeout: 15m
  check: {go: ./acceptance/download, module: harness, run: TestDownloadFromLibtorrent}

# ───────────────────────── M4 Swarm engine ─────────────────────────

- id: SEED-01
  src: "§4.1, §5.3, §5.4"
  ms: 4
  tier: L3
  text: "A torrent whose complete data is already in its download dir is verified on add, goes to seeding, serves a leecher byte-for-byte, and counts the upload in uploadedTotal."
  check: {go: ./acceptance/swarm, module: harness, run: TestSeedToLeecher}

- id: SEED-02
  src: "§11 interop, §14.10"
  ms: 4
  tier: L4
  text: "A real libtorrent leecher (Docker) downloads a torrent from torrentd, byte-identical."
  timeout: 10m
  check: {go: ./acceptance/swarm, module: harness, run: TestSeedToLibtorrent}

- id: SWARM-01
  src: "§4.1, §15.4"
  ms: 4
  tier: L3
  text: "While downloading from a seeder, torrentd sends HAVE for verified pieces and serves them to a leecher, which completes from torrentd alone."
  check: {go: ./acceptance/swarm, module: harness, run: TestPassThrough}

- id: CHOKE-01
  src: "§4.1 Choking"
  ms: 4
  tier: L3
  text: "With 6 interested leechers, at most 4 regular + 1 optimistic are unchoked at once, at least 4 are unchoked, and the optimistic slot rotates so that at least 5 distinct leechers are unchoked within 40 s."
  timeout: 5m
  check: {go: ./acceptance/swarm, module: harness, run: TestChokeSlots}

- id: WIRE-03
  src: "T6"
  ms: 4
  tier: L3
  text: "A request for more than 16 KiB gets reject_request (fast extension) or a disconnect within 15 s."
  check: {go: ./acceptance/swarm, module: harness, run: TestOversizeRequest}

- id: PICK-01
  src: "§4.1, A5"
  ms: 4
  tier: L3
  text: "Rarest-first: when pieces 24-47 exist only on one peer and 0-23 on three, at least 8 of the first 16 pieces requested from the single holder are rare, and no peer is asked for a piece it does not have."
  check: {go: ./acceptance/swarm, module: harness, run: TestRarestFirst}

- id: PICK-02
  src: "§4.1 endgame"
  ms: 4
  tier: L3
  text: "A connected peer that never answers requests for the last pieces does not hang the download (complete within 45 s from another peer), and duplicate requests are cancelled."
  check: {go: ./acceptance/swarm, module: harness, run: TestEndgame}

- id: PIPE-01
  src: "§4.1, D1"
  ms: 4
  tier: L3
  text: "Request pipelining adapts to the rate: a fast peer sees 50-250 outstanding requests."
  check: {go: ./acceptance/swarm, module: harness, run: TestPipelineAdapts}

- id: BAN-01
  src: "§4.1, G10, ADR-0006"
  ms: 4
  tier: L3
