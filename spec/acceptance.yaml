- id: API-09
  src: "G16"
  ms: 6
  tier: L3
  text: "A busy port on PATCH returns 409 port_in_use and keeps the old binding; a busy port at startup still serves the UI and reports the error; --peer-port makes the setting read-only and is not persisted."
  check: {go: ./internal/api, run: TestListenPort}

- id: API-10
  src: "G1"
  ms: 6
  tier: L3
  text: "resume on an error torrent moves it to checking."
