- id: STAT-01
  src: "§5.4, §6"
  ms: 6
  tier: L1
  text: "Rates are payload-only with a 5 s EMA; ratio = uploaded/max(downloaded, completed), or 0 when that is 0; etaSeconds is null unless downloading with rate > 0."
