# Acceptance matrix for torrentd.
#
# This maps each requirement to an executable check. It is the factory's
# definition of done, and "% of entries passing" is its progress bar.
#
# OWNERSHIP: This file and every check it names belong to the VERIFIER role.
# Implementer agents cannot edit them: the write-policy hook blocks them, and
# `factory integrity` fails the merge if they try. If a check is wrong, write
# an escalation in escalations/.
#
# Run it:  harness/factory gate --ms 1      (see harness/README.md)
# Status is never stored here: the gate writes results to runs/gate/.
#
# Fields:
#   id       Stable identifier. Never reuse an ID.
#   src      Spec section(s) and/or audit IDs (spec/spec-audit.md).
#   ms       Milestone from §15 (1 skeleton … 8 hardening).
#   tier     Harness tier: L0 static, L1 unit, L2 fuzz, L3 component, L4 swarm,
#            L5 interop, L6 E2E, L7 NFR (see factory-approaches.md §3.2).
#   text     The requirement, stated so it can be checked.
#   timeout  Optional per-check timeout (default 10m).
#   check    How the gate runs it. Exactly one kind:
#     go:         {go: ./pkg, run: TestX}
#                 A test in the product module (repo root). It only counts if
#                 TestX is defined in a *_acceptance_test.go file.
#     go+harness: {go: ./acceptance/pkg, module: harness, run: TestX}
#                 A black-box test in harness/acceptance/ that builds and runs
#                 the real binary (preferred: it doesn't constrain internals).
#     fuzz:       {fuzz: ./pkg, target: FuzzX, time: 30s}   (in an acceptance file)
#     vitest:     {vitest: web/**/*.acceptance.test.ts(x)}
#     playwright: {playwright: e2e/**/*.spec.ts}
#     script:     {script: harness/checks/<name>.sh}  (exit 0 = pass)
#     manual:     {manual: <procedure>}  (not gated; recorded at milestones)
#
# Package-level checks call APIs pinned in spec/contracts/go-api.md. Checks for
# milestones 3+ are placeholders: the verifier refines them (preferring
# black-box) before that milestone starts.

# ───────────────────────── §14 Acceptance criteria ─────────────────────────

- id: AC-01
  src: "§14.1"
  ms: 1
  tier: L6
  text: "`./torrentd` starts with no arguments and http://127.0.0.1:8080 serves the UI."
  check: {playwright: e2e/startup.spec.ts}

- id: AC-02
  src: "§14.2, §2, T5"
  ms: 1
  tier: L0
  text: "go.mod contains no BitTorrent/bencode/DHT/tracker libraries; tools/depcheck passes."
  check: {script: harness/checks/depcheck.sh}

- id: AC-03
  src: "§14.3"
  ms: 7
  tier: L6
  text: "User adds a .torrent or a magnet, chooses a folder, deselects files, and sees the torrent in the list within 1 s."
  check: {playwright: e2e/add-torrent.spec.ts}

- id: AC-04
  src: "§14.4"
  ms: 7
  tier: L6
  text: "While downloading, the list shows ↓/↑ speed, progress, ETA and peers/seeds, updating every second."
  check: {playwright: e2e/live-stats.spec.ts}

- id: AC-05
  src: "§14.5"
  ms: 7
  tier: L6
  text: "On completion the torrent moves to Seeding automatically and shows upload speed, uploaded total, ratio, seed time and added date."
  check: {playwright: e2e/seeding.spec.ts}

- id: AC-06
  src: "§14.6, §5.2"
  ms: 4
  tier: L4
  text: "Stop seeding: no further upload bytes, a `stopped` announce reaches the tracker, files are kept; Resume seeding brings it back to Seeding."
  check: {go: ./tools/swarm, run: TestStopSeeding}

- id: AC-06-UI
  src: "§14.6, §13 E2E"
  ms: 7
  tier: L6
  text: "UI flow: add → Seeding → click Stop seeding → Stopped → Resume seeding → Seeding."
  check: {playwright: e2e/stop-seeding.spec.ts}

- id: AC-07
  src: "§14.7, §5.2"
  ms: 6
  tier: L4
  text: "Reaching a ratio or seeding-time limit stops seeding automatically with stop_reason ratio_limit/time_limit, and the UI shows the reason."
  check: {go: ./tools/swarm, run: TestSeedingLimitAutoStop}

- id: AC-08
  src: "§14.8"
  ms: 7
  tier: L6
  text: "Pause/resume, recheck, reannounce, queue reordering, file priorities, per-torrent and global speed limits, and remove (with and without data) work and appear in the UI immediately."
  check: {playwright: e2e/actions.spec.ts}

- id: AC-09
  src: "§14.9"
  ms: 5
  tier: L4
  text: "Peers are discovered via HTTP trackers, UDP trackers, DHT, PEX and LSD, and each peer's `source` is reported correctly."
  check: {go: ./tools/swarm, run: TestDiscoverySources}

- id: AC-10
  src: "§14.10, T4, C2"
  ms: 8
  tier: L5
  text: "A torrent downloaded by torrentd can be seeded to qBittorrent and Transmission, and the other way around."
  check: {script: harness/checks/interop.sh}

- id: AC-11
  src: "§14.11, C3"
  ms: 8
  tier: L6
  text: "After a restart, all torrents reappear with their desired state, their progress (no full recheck when files are unchanged) and their lifetime totals."
  check: {playwright: e2e/restart.spec.ts}

- id: AC-12
  src: "§14.12"
  ms: 7
  tier: L6
  text: "Invalid files, bad magnets, duplicates and unwritable directories produce clear inline errors in the add dialog."
  check: {playwright: e2e/add-errors.spec.ts}

- id: AC-13
  src: "§14.13, §11 portability, §11 binary size"
  ms: 1
  tier: L0
  text: "CGO_ENABLED=0 builds for linux/amd64, linux/arm64, darwin/arm64 and windows/amd64; each binary is under 40 MB and runs with no other files."
  check: {script: harness/checks/cross-check.sh}

